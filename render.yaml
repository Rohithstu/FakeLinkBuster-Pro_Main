services:
  - type: web
    name: fakelinkbuster-pro
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt && python init_db.py && python init_history.py
    startCommand: gunicorn app_upgraded:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        value: generateValue
    plan: free
